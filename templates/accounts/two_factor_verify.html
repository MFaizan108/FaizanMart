{% extends "accounts/base.html" %}
{% block title %}Two-factor verification{% endblock %}
{% block content %}
<h1>Enter your authentication code</h1>
<p>Open your authenticator app and enter the 6-digit code.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Verify</button>
</form>
{% endblock %}
