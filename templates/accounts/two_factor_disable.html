{% extends "accounts/base.html" %}
{% block title %}Disable two-factor authentication{% endblock %}
{% block content %}
<h1>Disable two-factor authentication</h1>
<p>Confirm your password to disable 2FA.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Disable 2FA</button>
</form>
{% endblock %}
