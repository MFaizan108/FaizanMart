{% extends "accounts/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
</form>
<p><a href="{% url 'accounts:login' %}">Back to log in</a></p>
{% endblock %}
