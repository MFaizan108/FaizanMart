{% extends "accounts/base.html" %}
{% block title %}Log in — FaizanMart{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p><a href="{% url 'accounts:password-reset-request' %}">Forgot password?</a></p>
<p><a href="{% url 'accounts:google-login' %}">Continue with Google</a></p>
<p>New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
{% endblock %}
