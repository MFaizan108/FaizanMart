{% extends "accounts/base.html" %}
{% block title %}Log in — FaizanMart{% endblock %}
{% block auth_title %}Log in{% endblock %}
{% block auth_content %}
<form method="post" class="flex flex-col gap-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Log in</button>
</form>
<div class="flex flex-col gap-2 text-sm text-black/60">
    <a href="{% url 'accounts:password-reset-request' %}" class="text-brand hover:underline">Forgot password?</a>
    <a href="{% url 'accounts:google-login' %}" class="text-brand hover:underline">Continue with Google</a>
    <p>New here? <a href="{% url 'accounts:register' %}" class="text-brand hover:underline">Create an account</a></p>
</div>
{% endblock %}
