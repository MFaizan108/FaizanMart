<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FaizanMart{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; color: #222; }
        h1 { font-size: 1.4rem; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 8px; font-size: 1rem; }
        button { padding: 9px; font-size: 1rem; cursor: pointer; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 8px; margin-bottom: 8px; border-radius: 4px; }
        .messages .success { background: #dcfce7; }
        .messages .error { background: #fee2e2; }
        .messages .info { background: #dbeafe; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { text-align: left; padding: 6px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
