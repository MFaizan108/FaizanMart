{% extends "accounts/base.html" %}
{% block title %}Register — FaizanMart{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
