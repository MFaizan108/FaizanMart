{% extends "storefront/_account_base.html" %}
{% load static %}

{% block title %}Notifications — FaizanMart{% endblock %}

{% block account_content %}
<div class="flex flex-col gap-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Notifications</h1>
        <button id="mark-all-read-btn" type="button" class="btn-secondary">Mark all as read</button>
    </div>
    <div id="notifications-loading" class="card flex flex-col divide-y divide-black/5">
        {% for _ in "1234" %}
        <div class="flex items-start gap-3 p-4">
            <div class="skeleton mt-1.5 h-2 w-2 shrink-0 rounded-full"></div>
            <div class="flex flex-1 flex-col gap-2">
                <div class="skeleton h-4 w-1/2"></div>
                <div class="skeleton h-3 w-3/4"></div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div id="notifications-empty" class="hidden fade-in card flex-col items-center gap-2 p-12 text-center">
        <span class="text-4xl">🔔</span>
        <p class="text-black/50">No notifications yet.</p>
    </div>
    <div id="notifications-list" class="flex flex-col divide-y divide-black/5 card"></div>
</div>

<template id="notification-template">
    <div class="notification-row flex items-start gap-3 p-4">
        <span class="unread-dot mt-1.5 h-2 w-2 shrink-0 rounded-full bg-brand"></span>
        <div class="flex-1">
            <p class="notification-title font-medium"></p>
            <p class="notification-message text-sm text-black/60"></p>
            <p class="notification-time mt-1 text-xs text-black/40"></p>
        </div>
    </div>
</template>
{% endblock %}

{% block extra_js %}
<script src="{% static 'storefront/js/notifications.js' %}"></script>
{% endblock %}
