{% extends "base.html" %}
{% load static %}

{% block title %}Order — FaizanMart{% endblock %}

{% block content %}
<div id="order-root" class="mx-auto flex max-w-2xl flex-col gap-6 px-4 py-8" data-order-id="{{ order_id }}">
    <p id="order-loading" class="text-center text-black/50">Loading order...</p>
    <p id="order-error" class="hidden text-center text-red-600"></p>
    <div id="order-content" class="hidden flex-col gap-6"></div>
</div>

<template id="order-content-template">
    <div class="flex items-center justify-between">
        <h1 class="order-number text-2xl font-bold"></h1>
        <span class="order-status rounded-full bg-emerald-50 px-3 py-1 text-sm font-medium capitalize text-emerald-700"></span>
    </div>

    <section class="rounded-xl border border-black/10 p-4">
        <h2 class="items-heading mb-2 font-semibold"></h2>
        <div class="items-list flex flex-col divide-y divide-black/10"></div>
        <div class="totals mt-3 flex flex-col gap-1 border-t border-black/10 pt-3 text-sm"></div>
    </section>

    <section class="rounded-xl border border-black/10 p-4">
        <h2 class="mb-2 font-semibold">Shipping to</h2>
        <p class="shipping-address text-sm text-black/70"></p>
        <p class="payment-line mt-3 text-sm text-black/50"></p>
    </section>

    <section class="rounded-xl border border-black/10 p-4">
        <h2 class="mb-2 font-semibold">Status history</h2>
        <div class="status-history flex flex-col gap-2 text-sm"></div>
    </section>
</template>
{% endblock %}

{% block extra_js %}
<script src="{% static 'storefront/js/order_detail.js' %}"></script>
{% endblock %}
