{% extends "storefront/_account_base.html" %}
{% load static %}

{% block title %}My Orders — FaizanMart{% endblock %}

{% block account_content %}
<div class="flex flex-col gap-6">
    <h1 class="text-2xl font-bold">My orders</h1>
    <p id="placed-banner" class="hidden rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-700"></p>
    <div id="orders-loading" class="card flex flex-col divide-y divide-black/10">
        {% for _ in "123" %}
        <div class="flex items-center justify-between gap-4 px-4 py-4">
            <div class="flex flex-col gap-2">
                <div class="skeleton h-4 w-32"></div>
                <div class="skeleton h-3 w-24"></div>
            </div>
            <div class="skeleton h-4 w-20"></div>
        </div>
        {% endfor %}
    </div>

    <div id="orders-empty" class="hidden fade-in flex-col items-center gap-3 py-16 text-center">
        <span class="text-5xl">📦</span>
        <p class="text-black/50">No orders yet.</p>
        <a href="{% url 'storefront:product_list' %}" class="btn-primary mt-2">Browse products</a>
    </div>

    <div id="orders-list" class="card flex flex-col divide-y divide-black/10"></div>
</div>

<template id="order-row-template">
    <a class="order-link flex items-center justify-between gap-4 px-4 py-4 hover:text-brand" href="#">
        <div>
            <p class="order-number font-medium"></p>
            <p class="order-meta text-sm text-black/50"></p>
        </div>
        <div class="text-right">
            <p class="order-total font-semibold"></p>
            <p class="order-status text-sm capitalize text-black/50"></p>
        </div>
    </a>
</template>
{% endblock %}

{% block extra_js %}
<script src="{% static 'storefront/js/order_list.js' %}"></script>
{% endblock %}
