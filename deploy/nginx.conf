# Nginx reverse proxy: Internet -> Nginx (TLS) -> Daphne (ASGI, port 8000) -> Django -> Postgres
#
# Usage: copy to /etc/nginx/sites-available/faizanmart.site, symlink into
# sites-enabled, then `certbot --nginx -d faizanmart.site -d www.faizanmart.site`
# to obtain/install the SSL certificate (certbot rewrites the server block below
# to add the `listen 443 ssl` + certificate directives automatically).
#
# Assumes the app stack (web/celery/celery-beat/db/redis/elasticsearch) is running
# via docker-compose on the same host, with `web` published on 127.0.0.1:8000.

upstream faizanmart_app {
    server 127.0.0.1:8000;
}

# Plain HTTP: redirect everything to HTTPS. Certbot will insert the 443 server
# block below this one and rewrite this block to only handle the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name faizanmart.site www.faizanmart.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faizanmart.site www.faizanmart.site;

    ssl_certificate     /etc/letsencrypt/live/faizanmart.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faizanmart.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    access_log /var/log/nginx/faizanmart.access.log;
    error_log  /var/log/nginx/faizanmart.error.log;

    # Static files — collected by `manage.py collectstatic` into staticfiles/,
    # served directly by Nginx instead of round-tripping through Django/whitenoise.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files — only relevant if CLOUDINARY_URL is unset and uploads are stored
    # on local disk; skip this block entirely once Cloudinary (or S3) is configured.
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # WebSocket (real-time chat) — needs the Upgrade/Connection headers forwarded so
    # Nginx switches the connection instead of trying to proxy it as plain HTTP.
    location /ws/ {
        proxy_pass http://faizanmart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://faizanmart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
